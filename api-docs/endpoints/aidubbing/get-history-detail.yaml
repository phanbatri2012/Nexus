# GET /v1/aidubbing/history/{id}
# Get AI dubbing task detail

method: GET
path: /v1/aidubbing/history/{id}
group: Dubbing
title: Get history detail
description: |
  Get one task by ID (use for polling). `result.audio_url` = dubbed video (mp4)
  for video sources, else mp3; `result.srt_url` = translated subtitles.
order: 5

# Authentication
auth:
  type: xi-api-key
  required: true

# Path Parameters
path_parameters:
  - name: id
    type: string
    required: true
    description: Task ID returned when the dubbing was created
    example: 9b19d3e2-7c68-4eca-be48-e9917682d73e

# Query Parameters
query_parameters: []

# Request Body
request_body: null

# Code Examples
examples:
  curl: |
    curl -X GET "https://api.genmax.io/v1/aidubbing/history/{id}" \
      -H "xi-api-key: YOUR_API_KEY"

  javascript: |
    const response = await fetch('https://api.genmax.io/v1/aidubbing/history/{id}', {
      headers: { 'xi-api-key': 'YOUR_API_KEY' }
    });
    const task = await response.json();

  python: |
    import requests

    response = requests.get(
        'https://api.genmax.io/v1/aidubbing/history/{id}',
        headers={'xi-api-key': 'YOUR_API_KEY'},
    )
    task = response.json()

# Responses
responses:
  - status: 200
    description: OK
    example: |
      {
        "id": "9b19d3e2-7c68-4eca-be48-e9917682d73e",
        "user_id": "user_123",
        "status": "completed",
        "progress": 100,
        "source_lang": "en",
        "target_lang": "vi",
        "provider": "minimax",
        "voice_id": "Wise_Woman",
        "model_id": "speech-2.8-hd",
        "source_audio_url": "https://api.genmax.io/audio/9b19d3e2-7c68-4eca-be48-e9917682d73e.mp3",
        "result": {
          "audio_url": "https://api.genmax.io/audio/9b19d3e2-7c68-4eca-be48-e9917682d73e.mp4",
          "srt_url": "https://api.genmax.io/audio/9b19d3e2-7c68-4eca-be48-e9917682d73e.target.srt"
        },
        "metadata": {
          "source_file_name": "interview.mp4",
          "original_video_url": "https://api.genmax.io/audio/9b19d3e2-7c68-4eca-be48-e9917682d73e_orig.mp4",
          "voice_name": "Wise Woman"
        },
        "credits_deducted": 18000,
        "created_at": "2026-06-11T10:30:00Z",
        "updated_at": "2026-06-11T10:35:15Z"
      }

  - status: 404
    description: Not found - task does not exist or belongs to another user
    example: |
      {
        "error": "task not found"
      }
