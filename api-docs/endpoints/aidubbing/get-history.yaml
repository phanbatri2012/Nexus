# GET /v1/aidubbing/history
# Get AI dubbing history

method: GET
path: /v1/aidubbing/history
group: Dubbing
title: Get history list
description: Get list of AI dubbing tasks, ordered by newest first.
order: 4

# Authentication
auth:
  type: xi-api-key
  required: true

# Path Parameters
path_parameters: []

# Query Parameters
query_parameters:
  - name: page_size
    type: int
    required: false
    default: 30
    description: Number of tasks per page (max 100)
    example: 30

  - name: page
    type: int
    required: false
    default: 0
    description: Page number (0-indexed)
    example: 0

# Request Body
request_body: null

# Code Examples
examples:
  curl: |
    curl -X GET "https://api.genmax.io/v1/aidubbing/history?page_size=30&page=0" \
      -H "xi-api-key: YOUR_API_KEY"

  javascript: |
    const response = await fetch('https://api.genmax.io/v1/aidubbing/history?page_size=30&page=0', {
      headers: { 'xi-api-key': 'YOUR_API_KEY' }
    });
    const data = await response.json();
    console.log(data.tasks);

  python: |
    import requests

    response = requests.get(
        'https://api.genmax.io/v1/aidubbing/history',
        headers={'xi-api-key': 'YOUR_API_KEY'},
        params={'page_size': 30, 'page': 0},
    )
    history = response.json()

# Responses
