# POST /v1/minimax/voices/{voice_id}/retry
# Retry voice clone

method: POST
path: /v1/minimax/voices/{voice_id}/retry
group: MiniMax Voices
title: Retry clone
description: Retry a failed or completed voice clone. Re-uses the original audio file and settings, re-deducts credits.
order: 4

# Authentication
auth:
  type: xi-api-key
  required: true

# Path Parameters
path_parameters:
  - name: id
    type: string
    required: true
    description: Voice clone ID (UUID)

# Query Parameters
query_parameters: []

# Request Body
request_body: null

# Code Examples
examples:
  curl: |
    curl -X POST "https://api.genmax.io/v1/minimax/voices/{voice_id}/retry" \
      -H "xi-api-key: YOUR_API_KEY"

  javascript: |
    const response = await fetch('https://api.genmax.io/v1/minimax/voices/{voice_id}/retry', {
      method: 'POST',
      headers: { 'xi-api-key': 'YOUR_API_KEY' }
    });
    const data = await response.json();

  python: |
    import requests

    response = requests.post(
        'https://api.genmax.io/v1/minimax/voices/{voice_id}/retry',
        headers={'xi-api-key': 'YOUR_API_KEY'},
    )
    data = response.json()

# Responses
responses:
  - status: 200
    description: Clone re-initiated (processing async)
    example: |
      {
        "id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
        "voice_name": "My Voice",
        "language_tag": "English",
        "gender": "Male",
        "status": "processing",
        "created_at": "2026-02-08T10:30:00Z"
      }
