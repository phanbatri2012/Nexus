# GET /v1/minimax/voices
# List cloned voices

method: GET
path: /v1/minimax/voices
group: MiniMax Voices
title: List cloned voices
description: Get all cloned voices for the authenticated user. Returns voices with status processing, done, or failed (excludes deleted).
order: 1

# Authentication
auth:
  type: xi-api-key
  required: true

# Path Parameters
path_parameters: []

# Query Parameters
query_parameters: []

# Request Body
request_body: null

# Code Examples
examples:
  curl: |
    curl -X GET "https://api.genmax.io/v1/minimax/voices" \
      -H "xi-api-key: YOUR_API_KEY"

  javascript: |
    const response = await fetch('https://api.genmax.io/v1/minimax/voices', {
      method: 'GET',
      headers: { 'xi-api-key': 'YOUR_API_KEY' }
    });
    const data = await response.json();

  python: |
    import requests

    response = requests.get(
        'https://api.genmax.io/v1/minimax/voices',
        headers={'xi-api-key': 'YOUR_API_KEY'},
    )
    data = response.json()

# Responses
responses:
  - status: 200
    description: OK
    example: |
      {
        "voices": [
          {
            "id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
            "voice_name": "My Custom Voice",
            "sample_audio_url": "https://api.genmax.io/audio/minimax/user123/a1b2c3d4_sample.mp3",
            "cover_url": "https://api.genmax.io/audio/minimax/user123/a1b2c3d4_cover.png",
            "language_tag": "English",
            "gender": "Male",
            "status": "done",
            "created_at": "2026-02-08T10:30:00Z"
          },
          {
            "id": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
            "voice_name": "Processing Voice",
            "language_tag": "English",
            "gender": "Female",
            "status": "processing",
            "created_at": "2026-02-08T10:35:00Z"
          }
        ]
      }
