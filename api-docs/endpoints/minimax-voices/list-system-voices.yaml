# GET /v1/minimax/system-voices
# List MiniMax system voices

method: GET
path: /v1/minimax/system-voices
group: MiniMax Voices
title: List system voices
description: Browse MiniMax system voice library with optional filters.
order: 0

# Authentication
auth:
  type: xi-api-key
  required: true

# Path Parameters
path_parameters: []

# Query Parameters
query_parameters:
  - name: page
    type: integer
    required: false
    default: 1
    description: Page number (1-indexed)
  - name: page_size
    type: integer
    required: false
    default: 30
    description: Number of voices per page
  - name: search
    type: string
    required: false
    description: Search text to filter voices by name
  - name: gender
    type: string
    required: false
    description: "Gender filter (e.g. Male, Female)"
  - name: language
    type: string
    required: false
    description: "Language filter (e.g. English, Chinese (Mandarin), Japanese)"
  - name: accent
    type: string
    required: false
    description: "Accent filter (e.g. EN-US (General), EN-British, EN-Australian)"
  - name: age
    type: string
    required: false
    description: "Age filter, comma-separated for multiple (e.g. Young, Middle-aged)"
  - name: use_cases
    type: string
    required: false
    description: "Use case filter, comma-separated for multiple (e.g. Audiobook,Podcast)"

# Request Body
request_body: null

# Code Examples
examples:
  curl: |
    # Basic request (first page)
    curl -X GET "https://api.genmax.io/v1/minimax/system-voices?page=1&page_size=30" \
      -H "xi-api-key: YOUR_API_KEY"

    # With filters
    curl -X GET "https://api.genmax.io/v1/minimax/system-voices\
      ?page=1\
      &page_size=30\
      &language=English\
      &gender=Male\
      &age=Young\
      &accent=EN-US%20(General)\
      &use_cases=Audiobook,Podcast\
      &search=narrator" \
      -H "xi-api-key: YOUR_API_KEY"

  javascript: |
    // Basic request (first page)
    const response = await fetch('https://api.genmax.io/v1/minimax/system-voices?page=1&page_size=30', {
      method: 'GET',
      headers: { 'xi-api-key': 'YOUR_API_KEY' }
    });
    const data = await response.json();

    // With filters
    const params = new URLSearchParams({
      page: '1',
      page_size: '30',
      language: 'English',
      gender: 'Male',
      age: 'Young',
      accent: 'EN-US (General)',
      use_cases: 'Audiobook,Podcast',
      search: 'narrator',
    });
    const filtered = await fetch(`https://api.genmax.io/v1/minimax/system-voices?${params}`, {
      method: 'GET',
      headers: { 'xi-api-key': 'YOUR_API_KEY' }
    });
    const filteredData = await filtered.json();

  python: |
    import requests

    headers = {'xi-api-key': 'YOUR_API_KEY'}

    # Basic request (first page)
    response = requests.get(
        'https://api.genmax.io/v1/minimax/system-voices',
        headers=headers,
        params={'page': 1, 'page_size': 30},
    )
    data = response.json()

    # With filters
    response = requests.get(
        'https://api.genmax.io/v1/minimax/system-voices',
        headers=headers,
        params={
            'page': 1,
            'page_size': 30,
            'language': 'English',
            'gender': 'Male',
            'age': 'Young',
            'accent': 'EN-US (General)',
            'use_cases': 'Audiobook,Podcast',
            'search': 'narrator',
        },
    )
    data = response.json()

# Responses
