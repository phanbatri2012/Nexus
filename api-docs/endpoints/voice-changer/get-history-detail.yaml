# GET /v1/voice-changer/history/{id}
# Get voice changer task detail

method: GET
path: /v1/voice-changer/history/{id}
group: Voice Changer
title: Get history detail
description: Get details of a specific voice changer task by ID, including status and audio URL
order: 3

# Authentication
auth:
  type: xi-api-key
  required: true

# Path Parameters
path_parameters:
  - name: id
    type: string
    required: true
    description: Task ID

# Query Parameters
query_parameters: []

# Request Body
request_body: null

# Code Examples
examples:
  curl: |
    curl -X GET "https://api.genmax.io/v1/voice-changer/history/{id}" \
      -H "xi-api-key: YOUR_API_KEY"

  javascript: |
    const response = await fetch('https://api.genmax.io/v1/voice-changer/history/{id}', {
      headers: {
        'xi-api-key': 'YOUR_API_KEY'
      }
    });
    const task = await response.json();

  python: |
    import requests

    response = requests.get(
        'https://api.genmax.io/v1/voice-changer/history/{id}',
        headers={'xi-api-key': 'YOUR_API_KEY'}
    )
    task = response.json()

# Responses
responses:
  - status: 200
    description: Status can be pending, processing, completed, or failed
    example: |
      {
        "id": "9b19d3e2-7c68-4eca-be48-e9917682d73e",
        "user_id": "user_123",
        "status": "completed",
        "progress": 100,
        "voice_id": "rv30Fd6w5bnbL0kHzWlr",
        "model_id": "eleven_multilingual_sts_v2",
        "source_audio_url": "https://api.genmax.io/audio/vc_source_abc123.mp3",
        "result": {
          "audio_url": "https://api.genmax.io/audio/vc_result_abc123.mp3"
        },
        "metadata": {
          "voice_settings": {
            "stability": 0.5,
            "similarity_boost": 0.75
          },
          "remove_noise": false
        },
        "credits_deducted": 500,
        "error": null,
        "detail_error": null,
        "created_at": "2026-03-17T10:30:00Z",
        "updated_at": "2026-03-17T10:30:15Z"
      }
