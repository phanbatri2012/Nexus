# DELETE /v1/history/{id}
# Delete history

method: DELETE
path: /v1/history/{id}
group: Text to speech
title: Delete history
description: Delete a text to speech task from history
order: 4

# Authentication
auth:
  type: xi-api-key
  required: true

# Path Parameters
path_parameters:
  - name: id
    type: string
    required: true
    description: History item ID

# Query Parameters
query_parameters: []

# Request Body
request_body: null

# Code Examples
examples:
  curl: |
    curl -X DELETE "https://api.genmax.io/v1/history/{id}" \
      -H "xi-api-key: YOUR_API_KEY"

  javascript: |
    const response = await fetch('https://api.genmax.io/v1/history/{id}', {
      method: 'DELETE',
      headers: {
        'xi-api-key': 'YOUR_API_KEY'
      }
    });
    const data = await response.json();

  python: |
    import requests

    response = requests.delete(
        'https://api.genmax.io/v1/history/{id}',
        headers={'xi-api-key': 'YOUR_API_KEY'},
    )
    data = response.json()

# Responses
responses:
  - status: 200
    description: OK
    example: |
      {
        "message": "deleted"
      }
