# GET /v1/history
# Get history

method: GET
path: /v1/history
group: Text to speech
title: Get history list
description: Get list of text to speech tasks, dialogue tasks across all providers
order: 3

# Authentication
auth:
  type: xi-api-key
  required: true

# Path Parameters
path_parameters: []

# Query Parameters
query_parameters:
  - name: page_size
    type: int
    required: false
    default: 30
    description: Number of tasks per page (max 100)
    example: 30

  - name: page
    type: int
    required: false
    default: 0
    description: Page number (0-indexed)
    example: 0

# Request Body
request_body: null

# Code Examples
examples:
  curl: |
    curl -X GET "https://api.genmax.io/v1/history?page_size=30&page=0" \
      -H "xi-api-key: YOUR_API_KEY"

  javascript: |
    const response = await fetch('https://api.genmax.io/v1/history?page_size=30&page=0', {
      headers: {
        'xi-api-key': 'YOUR_API_KEY'
      }
    });
    const data = await response.json();
    console.log(data.tasks);

  python: |
    import requests

    response = requests.get(
        'https://api.genmax.io/v1/history',
        headers={'xi-api-key': 'YOUR_API_KEY'},
        params={'page_size': 30, 'page': 0}
    )
    history = response.json()

# Responses
responses:
  - status: 200
    description: "Success. The provider field indicates which TTS engine was used: 'elevenlabs' or 'minimax'."
