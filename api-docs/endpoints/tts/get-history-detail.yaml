# GET /v1/history/{id}
# Get history detail

method: GET
path: /v1/history/{id}
group: Text to speech
title: Get history detail
description: Get details of a specific text to speech task, dialogue task by ID, including status and audio URL
order: 2

# Authentication
auth:
  type: xi-api-key
  required: true

# Path Parameters
path_parameters:
  - name: id
    type: string
    required: true
    description: Task ID

# Query Parameters
query_parameters: []

# Request Body
request_body: null

# Code Examples
examples:
  curl: |
    curl -X GET "https://api.genmax.io/v1/history/{id}" \
      -H "xi-api-key: YOUR_API_KEY"

  javascript: |
    const response = await fetch('https://api.genmax.io/v1/history/{id}', {
      headers: {
        'xi-api-key': 'YOUR_API_KEY'
      }
    });
    const task = await response.json();
    console.log(task.audio_url);

  python: |
    import requests

    response = requests.get(
        'https://api.genmax.io/v1/history/{id}',
        headers={'xi-api-key': 'YOUR_API_KEY'}
    )
    task = response.json()

# Responses
responses:
  - status: 200
    description: Status can be pending, processing, completed, or failed
    example: |
      {
        "id": "id_of_the_task",
        "user_id": "id_of_the_user",
        "status": "processing",
        "progress": 60,
        "provider": "elevenlabs",
        "text": "Hello world!",
        "voice_id": "UgBBYS2sOqTuMpoF3BR0",
        "model_id": "eleven_multilingual_v2",
        "metadata": {
          "voice_settings": {
            "stability": 0.5,
            "similarity_boost": 0.75,
            "style": 0,
            "use_speaker_boost": true,
            "speed": 1
          }
        },
        "result": {
          "audio_url": "https://api.genmax.io/audio/id_of_the_task.mp3"
        },
        "error": string | null,
        "characters_used": 12,
        "credits_deducted": 12,
        "created_at": "2026-01-24T07:42:13.641779Z",
        "updated_at": "2026-01-24T07:42:16.432458Z"
      }
