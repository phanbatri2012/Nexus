# POST /v1/history/{id}/retry
# Retry TTS task

method: POST
path: /v1/history/{id}/retry
group: Text to speech
title: Retry task
description: Retry a failed or completed TTS task. Re-uses the original text and settings, re-deducts credits. Supports regular TTS, SRT, and dialogue tasks.
order: 5

# Authentication
auth:
  type: xi-api-key
  required: true

# Path Parameters
path_parameters:
  - name: id
    type: string
    required: true
    description: Task ID to retry

# Query Parameters
query_parameters: []

# Request Body
request_body: null

# Code Examples
examples:
  curl: |
    curl -X POST "https://api.genmax.io/v1/history/{id}/retry" \
      -H "xi-api-key: YOUR_API_KEY"

  javascript: |
    const response = await fetch('https://api.genmax.io/v1/history/{id}/retry', {
      method: 'POST',
      headers: {
        'xi-api-key': 'YOUR_API_KEY'
      }
    });
    const data = await response.json();

  python: |
    import requests

    response = requests.post(
        'https://api.genmax.io/v1/history/{id}/retry',
        headers={'xi-api-key': 'YOUR_API_KEY'},
    )
    data = response.json()

# Responses
responses:
  - status: 202
    description: Accepted - Task re-queued for processing
    example: |
      {
        "id": "9b19d3e2-7c68-4eca-be48-e9917682d73e",
        "status": "pending"
      }
