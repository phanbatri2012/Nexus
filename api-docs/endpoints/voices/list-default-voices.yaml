# GET /v1/default-voices
# List default/premade ElevenLabs voices

method: GET
path: /v1/default-voices
group: Elevenlabs Voices
title: List default voices
description: Get ElevenLabs default/premade voices. These are high-quality built-in voices available to all users.
order: 1

# Authentication
auth:
  type: xi-api-key
  required: true

# Path Parameters
path_parameters: []

# Query Parameters
query_parameters:
  - name: page_size
    type: integer
    required: false
    default: 30
    description: Number of voices per page
  - name: search
    type: string
    required: false
    description: Search term to filter voices by name

# Request Body
request_body: null

# Code Examples
examples:
  curl: |
    # Get default voices
    curl -X GET "https://api.genmax.io/v1/default-voices?page_size=30" \
      -H "xi-api-key: YOUR_API_KEY"

    # Search for a specific voice
    curl -X GET "https://api.genmax.io/v1/default-voices?search=aria&page_size=30" \
      -H "xi-api-key: YOUR_API_KEY"

  javascript: |
    // Get default voices
    const response = await fetch('https://api.genmax.io/v1/default-voices?page_size=30', {
      method: 'GET',
      headers: { 'xi-api-key': 'YOUR_API_KEY' }
    });
    const data = await response.json();

    // Search for a specific voice
    const searchResponse = await fetch('https://api.genmax.io/v1/default-voices?search=aria&page_size=30', {
      method: 'GET',
      headers: { 'xi-api-key': 'YOUR_API_KEY' }
    });
    const searchData = await searchResponse.json();

  python: |
    import requests

    headers = {'xi-api-key': 'YOUR_API_KEY'}

    # Get default voices
    response = requests.get(
        'https://api.genmax.io/v1/default-voices',
        headers=headers,
        params={'page_size': 30}
    )
    data = response.json()

    # Search for a specific voice
    response = requests.get(
        'https://api.genmax.io/v1/default-voices',
        headers=headers,
        params={'search': 'aria', 'page_size': 30}
    )
    data = response.json()

